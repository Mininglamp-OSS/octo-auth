name: go

on:
  pull_request:
    paths:
      - "go/**"
      - "contract/**"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "go/**"
      - "contract/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  go-build-test:
    name: Build & test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum

      - name: Tidy check
        working-directory: go
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum are out of date; run 'go mod tidy' in go/"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: gofmt
        working-directory: go
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test -race -shuffle=on -count=1 -timeout 5m -cover ./...
