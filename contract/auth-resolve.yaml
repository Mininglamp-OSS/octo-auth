openapi: 3.1.0
info:
  title: Octo Bot identity resolution
  version: 1.0.0
  contact:
    name: octo-auth maintainers
    url: https://github.com/Mininglamp-OSS/octo-auth
  description: >-
    Resolves the effective identity for an existing Bot token. Existing v1
    Verify endpoints and their response semantics are unchanged. Resolve
    determines identity and delegation, not business-resource permission.
    The internal path identifies a service integration protocol; it does not
    introduce a second service credential or provide network isolation by
    itself. Resolve deliberately uses the flat `{code, request_id}` error
    envelope defined in this document; it does not use the nested verify-only
    envelope from `errors-v1.yaml`.
servers:
  - url: https://octo-server.example.com
    description: Configure the same octo-server deployment used by existing verifiers.
tags:
  - name: resolve
    description: Bot identity resolution.
paths:
  /v1/internal/auth/resolve:
    post:
      operationId: resolveBotIdentity
      tags: [resolve]
      description: >-
        Uses the existing Bot token. AS_BOT resolves the Bot itself. OBO also
        requires a trusted action and resolves the Bot owner as the subject.
        Middleware must bind mode and action from its controlled route; callers
        must not supply an arbitrary action or subject selector.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Identity and, for OBO, delegation resolved.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPrincipal'
        '400': { $ref: '#/components/responses/ResolveError' }
        '401': { $ref: '#/components/responses/ResolveError' }
        '403': { $ref: '#/components/responses/ResolveError' }
        '503': { $ref: '#/components/responses/ResolveError' }
components:
  responses:
    ResolveError:
      description: >-
        Resolve-specific flat error envelope. Failed closed; HTTP status and
        code must be interpreted together.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResolveError'
  schemas:
    ResolveRequest:
      oneOf:
        - $ref: '#/components/schemas/AsBotResolveRequest'
        - $ref: '#/components/schemas/OBOResolveRequest'
      discriminator:
        propertyName: mode
        mapping:
          AS_BOT: '#/components/schemas/AsBotResolveRequest'
          OBO: '#/components/schemas/OBOResolveRequest'
    AsBotResolveRequest:
      type: object
      additionalProperties: false
      required: [bot_token, mode, space_id]
      properties:
        bot_token: { type: string, pattern: '^bf_.+$' }
        mode: { type: string, enum: [AS_BOT] }
        space_id: { type: string, minLength: 1 }
    OBOResolveRequest:
      type: object
      additionalProperties: false
      required: [bot_token, mode, space_id, action]
      properties:
        bot_token: { type: string, pattern: '^bf_.+$' }
        mode: { type: string, enum: [OBO] }
        space_id: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        resource:
          $ref: '#/components/schemas/Resource'
    Resource:
      type: object
      additionalProperties: false
      description: Optional trusted audit context; not an authorization input in v1.
      required: [type, id]
      properties:
        type: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
    Identity:
      type: object
      additionalProperties: false
      required: [uid, kind, space_id]
      properties:
        uid: { type: string, minLength: 1 }
        kind: { type: string, enum: [BOT, HUMAN] }
        space_id: { type: string, minLength: 1 }
    Delegation:
      type: object
      additionalProperties: false
      required: [grant_id, matched_scope, policy_version, action, decision_id]
      properties:
        grant_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        matched_scope: { type: string, enum: [ALL] }
        policy_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        action: { type: string, minLength: 1 }
        decision_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
    ResolvedPrincipal:
      oneOf:
        - $ref: '#/components/schemas/AsBotResolvedPrincipal'
        - $ref: '#/components/schemas/OBOResolvedPrincipal'
      discriminator:
        propertyName: mode
        mapping:
          AS_BOT: '#/components/schemas/AsBotResolvedPrincipal'
          OBO: '#/components/schemas/OBOResolvedPrincipal'
    AsBotResolvedPrincipal:
      type: object
      additionalProperties: false
      required: [mode, actor, subject]
      properties:
        mode: { type: string, enum: [AS_BOT] }
        actor: { $ref: '#/components/schemas/Identity' }
        subject: { $ref: '#/components/schemas/Identity' }
    OBOResolvedPrincipal:
      type: object
      additionalProperties: false
      required: [mode, actor, subject, delegation]
      properties:
        mode: { type: string, enum: [OBO] }
        actor: { $ref: '#/components/schemas/Identity' }
        subject: { $ref: '#/components/schemas/Identity' }
        delegation: { $ref: '#/components/schemas/Delegation' }
    ResolveError:
      type: object
      additionalProperties: false
      required: [code, request_id]
      properties:
        code:
          type: string
          enum:
            - invalid_mode
            - invalid_request
            - missing_space_id
            - invalid_credential
            - disabled
            - space_not_allowed
            - delegation_denied
            - action_not_allowed
            - infra_failure
        request_id: { type: string, minLength: 1 }
