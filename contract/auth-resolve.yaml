openapi: 3.0.3
info:
  title: Octo Bot identity resolution
  version: 1.0.0
  contact:
    name: octo-auth maintainers
    url: https://github.com/Mininglamp-OSS/octo-auth
  description: >-
    New Bot identity endpoint. Existing v1 Verify endpoints
    and their response semantics are unchanged. Resolve decides identity and
    delegation, not business-resource permission.
servers:
  - url: https://octo-server.example.com
    description: Placeholder; configure your deployment's octo-server URL.
tags:
  - name: resolve
    description: Bot identity resolution.
paths:
  /v1/auth/resolve:
    post:
      operationId: resolveBotIdentity
      tags: [resolve]
      description: >-
        Uses the existing Bot token. Backends derive action from a controlled
        route; the server checks Action registration but cannot authenticate
        the calling service. Bot and CLI clients must not choose action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Identity and, for OBO, delegation resolved.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPrincipal'
        '400': { $ref: '#/components/responses/ResolveError' }
        '401': { $ref: '#/components/responses/ResolveError' }
        '403': { $ref: '#/components/responses/ResolveError' }
        '503': { $ref: '#/components/responses/ResolveError' }
components:
  responses:
    ResolveError:
      description: Failed closed; HTTP status and code must be interpreted together.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResolveError'
  schemas:
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [bot_token, mode, space_id]
      properties:
        bot_token: { type: string, minLength: 1 }
        mode: { type: string, enum: [AS_BOT, OBO] }
        space_id: { type: string, minLength: 1 }
        action:
          type: string
          description: Required only for OBO; forbidden for AS_BOT.
        resource:
          type: object
          description: Optional trusted audit context; not an authorization input in v1.
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
    Identity:
      type: object
      required: [uid, kind, space_id]
      properties:
        uid: { type: string, minLength: 1 }
        kind: { type: string, enum: [BOT, HUMAN] }
        space_id: { type: string, minLength: 1 }
    Delegation:
      type: object
      required: [grant_id, matched_scope, policy_version, action, decision_id]
      properties:
        grant_id: { type: integer, format: int64 }
        matched_scope: { type: string, enum: [ALL] }
        policy_version: { type: integer, format: int64 }
        action: { type: string }
        decision_id: { type: string }
    ResolvedPrincipal:
      type: object
      required: [mode, actor, subject]
      properties:
        mode: { type: string, enum: [AS_BOT, OBO] }
        actor: { $ref: '#/components/schemas/Identity' }
        subject: { $ref: '#/components/schemas/Identity' }
        delegation: { $ref: '#/components/schemas/Delegation' }
    ResolveError:
      type: object
      required: [code, request_id]
      properties:
        code:
          type: string
          enum:
            - invalid_mode
            - invalid_request
            - invalid_obo_request
            - missing_space_id
            - invalid_credential
            - disabled
            - space_not_allowed
            - delegation_denied
            - action_not_allowed
            - infra_failure
        request_id: { type: string }
